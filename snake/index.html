<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake - LGT Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header-top">
            <h1 class="title">SNAKE</h1>
            <div class="scores">
                <div class="score-box">
                    <span class="score-label">Score</span>
                    <span class="score-value" id="score">0</span>
                </div>
                <div class="score-box">
                    <span class="score-label">Best</span>
                    <span class="score-value" id="best-score">0</span>
                </div>
            </div>
        </div>

        <div class="header-bottom">
            <p class="desc">Devour the glowing databits. Don't crash into the mainframe walls or yourself.</p>
        </div>

        <div class="game-container">
            <div id="game-board" class="game-board"></div>
            
            <div id="game-message" class="game-message">
                <h2 id="msg-text">SYSTEM READY</h2>
                <div class="msg-actions">
                    <button id="start-btn" class="primary-btn">Initialize</button>
                    <button id="retry-btn" class="primary-btn hidden">Reboot</button>
                </div>
            </div>
        </div>
        
        <div class="controls-hint">
            <p><strong>Controls</strong>: W A S D / Arrow Keys to move. Swipe on mobile.</p>
        </div>
    </div>

    <script src="js/game.js"></script>
    <script src="/shared/layout.js"></script>
</body>
</html>
