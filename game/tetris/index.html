<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Web Tetris</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Background decorative elements -->
        <div class="bg-glow circle-1"></div>
        <div class="bg-glow circle-2"></div>
        
        <header>
            <h1 class="neon-title">TETRIS</h1>
        </header>
        
        <main class="game-area">
            <!-- Left Panel -->
            <aside class="side-panel left-panel glass-panel">
                <div class="panel-section">
                    <h2>HOLD</h2>
                    <div class="canvas-container">
                        <canvas id="hold-canvas" width="100" height="100"></canvas>
                    </div>
                </div>
                
                <div class="stats-container">
                    <div class="stat-box">
                        <span class="stat-label">SCORE</span>
                        <span class="stat-value" id="score">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">LEVEL</span>
                        <span class="stat-value" id="level">1</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">LINES</span>
                        <span class="stat-value" id="lines">0</span>
                    </div>
                </div>
            </aside>
            
            <!-- Center Board -->
            <div class="board-container glass-panel">
                <canvas id="board-canvas" width="300" height="600"></canvas>
                <div id="game-overlay" class="overlay">
                    <h2 id="overlay-title">Ready?</h2>
                    <p id="overlay-msg">Press Start to Play</p>
                    <button id="start-btn" class="neon-btn">PLAY</button>
                </div>
            </div>
            
            <!-- Right Panel -->
            <aside class="side-panel right-panel glass-panel">
                <div class="panel-section">
                    <h2>NEXT</h2>
                    <div class="canvas-container">
                        <canvas id="next-canvas" width="100" height="100"></canvas>
                    </div>
                </div>
                
                <div class="controls-info">
                    <h3>CONTROLS</h3>
                    <ul>
                        <li><kbd>←</kbd><kbd>→</kbd> <kbd>A</kbd><kbd>D</kbd> Move</li>
                        <li><kbd>↑</kbd> <kbd>W</kbd> Rotate</li>
                        <li><kbd>↓</kbd> <kbd>S</kbd> Soft Drop</li>
                        <li><kbd>Space</kbd> Hard Drop</li>
                        <li><kbd>Shift</kbd> Hold</li>
                        <li><kbd>P</kbd> Pause</li>
                    </ul>
                </div>
            </aside>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/constants.js"></script>
    <script src="js/tetromino.js"></script>
    <script src="js/board.js"></script>
    <script src="js/game.js"></script>
    <script src="/shared/layout.js"></script>
</body>
</html>
