<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGT Web Games Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="hero">
        <h1 class="hero-title">LGT GAMES</h1>
        <p class="hero-subtitle">Play modern logic puzzles and arcade classics.</p>
        
        <div class="filter-bar">
            <div class="search-box">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="search-input" placeholder="Search games...">
            </div>
            <div class="category-filters" id="category-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="arcade">Arcade</button>
                <button class="filter-btn" data-filter="logic">Logic</button>
                <button class="filter-btn" data-filter="puzzle">Puzzle</button>
            </div>
        </div>
    </div>

    <main class="grid-container" id="games-grid">
        <!-- Rendered dynamically by js/portal.js via data/games.json -->
    </main>

    <script src="/shared/layout.js"></script>
    <script src="/js/portal.js"></script>
    <script>
      // Initialize icons
      lucide.createIcons();
    </script>
</body>
</html>
